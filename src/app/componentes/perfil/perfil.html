<div class="perfil-container">

    <div class="perfil-card">

        <h1>👤 Mi Perfil</h1>

        <img
            *ngIf="foto"
            [src]="foto"
            alt="Usuario"
            class="foto-perfil">

        <h2>{{ nombre }}</h2>

        <p>
            <strong>Email:</strong>
            {{ email }}
        </p>

        <p>
            <strong>Rol:</strong>
        </p>

        <div
            [class.rol-admin]="rol === 'Admin'"
            [class.rol-usuario]="rol !== 'Admin'">

            {{ rol }}

        </div>

    </div>

</div>
