 <div class="login-container" [style.background]="colorFondo">

  <div class="login-card">

    <h1>Iniciar Sesión</h1>

    <div class="form-group">

      <label>Usuario</label>

      <input
        type="text"
        [(ngModel)]="usuario"
        placeholder="Usuario"
      >

    </div>

    <div class="form-group">

      <label>Contraseña</label>

      <div class="password-container">

        <input
          [type]="mostrarPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          placeholder="Contraseña"
        >

        <button
          type="button"
          (click)="togglePassword()"
        >
          {{ mostrarPassword ? 'Ocultar' : 'Mostrar' }}
        </button>

      </div>

    </div>

    <button
      class="btn-login"
      (click)="login()"
    >
      Ingresar
    </button>

    <button
      class="btn-google"
      (click)="loguearConGoogle()"
    >
      Ingresar con Google
    </button>

    <p
      *ngIf="mensajeError"
      class="error"
    >
      {{ mensajeError }}
    </p>

  </div>

</div>
