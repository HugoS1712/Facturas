<div
  class="login-page"
  [style.background]="colorFondo"
>

  <div class="login-container">

    <h1>🔐</h1>

    <h2>Iniciar Sesión</h2>

    <p class="subtitulo">
      Sistema de Gestión
    </p>

    <label>Usuario</label>

    <input
      type="text"
      [(ngModel)]="usuario"
      placeholder="Usuario"
    >

    <label>Contraseña</label>

    <div class="password-container">

      <input
        [type]="mostrarPassword ? 'text' : 'password'"
        [(ngModel)]="password"
        placeholder="Contraseña"
      >

      <button
        type="button"
        class="ojo"
        (click)="togglePassword()"
      >
        👁
      </button>

    </div>

    <button
      class="btn-login"
      (click)="login()"
    >
      Ingresar
    </button>

    <div class="separador">
      O
    </div>

    <button
      class="google-btn"
      (click)="loguearConGoogle()"
    >
      Ingresar con Google
    </button>

    @if (mensajeError) {

      <div class="error">
        {{ mensajeError }}
      </div>

    }

    <a
      routerLink="/"
      class="volver"
    >
      ← Volver al inicio
    </a>

  </div>

</div>
