<div
  class="login-page"
  [ngStyle]="{'background': colorFondo}">

  <div class="login-container">

    <h1>🎫</h1>

    <h2>Sistema de Tickets de Soporte</h2>

    <p class="subtitulo">
      Ingresá para acceder al sistema
    </p>

    <input
      type="text"
      [(ngModel)]="usuario"
      placeholder="Usuario">

    <div class="password-container">

      <input
        [type]="mostrarPassword ? 'text' : 'password'"
        [(ngModel)]="password"
        placeholder="Contraseña">

      <span
        class="ojo"
        (click)="togglePassword()">

        👁

      </span>

    </div>

    <button
      class="btn-login"
      (click)="login()">

      Ingresar

    </button>

    <div class="separador">
      o
    </div>

    <button
      class="google-btn"
      (click)="loguearConGoogle()">

      🔵 Ingresar con Google

    </button>

    <div
      *ngIf="mensajeError"
      class="error">

      {{ mensajeError }}

    </div>

    <a
      routerLink="/"
      class="volver">

      ← Volver al Inicio

    </a>

  </div>

</div>
