<h1>Foro</h1>

<textarea
    rows="5"
    cols="60"
    [(ngModel)]="mensajeForo!.mensaje">
</textarea>

<br><br>

<button (click)="enviar()">
    Enviar Mensaje
</button>

<hr>

<div *ngFor="let item of mensajes">

    <strong>
        {{ item.nombreUsuario }}
    </strong>

    <br>

    {{ item.mensaje }}

    <br>

    <small>
        {{ item.fecha }}
    </small>

    <hr>

</div>
``
