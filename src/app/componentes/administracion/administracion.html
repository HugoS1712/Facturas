<div class="contenedor-admin">

    <h1>Panel de Administración</h1>

    <button (click)="exportarCSV()">
        📄 Exportar Usuarios CSV
    </button>

    <h2>Nuevo Usuario</h2>

    <div class="formulario">

        <input
            type="text"
            placeholder="Nombre"
            [(ngModel)]="nuevoNombre">

        <input
            type="email"
            placeholder="Email"
            [(ngModel)]="nuevoEmail">

        <select [(ngModel)]="nuevoRol">
            <option value="Usuario">Usuario</option>
            <option value="Admin">Admin</option>
        </select>

        <button (click)="agregarUsuario()">
            Agregar Usuario
        </button>

    </div>

    <br>

    <p>
        Total usuarios: {{ usuarios.length }}
    </p>

    <h2>Usuarios Registrados</h2>

    <table class="tabla-usuarios">

        <thead>

            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>

        </thead>

        <tbody>

            <tr *ngFor="let usuario of usuarios">

                <td>{{ usuario.id }}</td>

                <td>{{ usuario.nombre }}</td>

                <td>{{ usuario.email }}</td>

                <td>{{ usuario.rol }}</td>

                <td>

                    <button
                        (click)="editarUsuario(usuario)">
                        Editar
                    </button>

                    <button
                        (click)="eliminarUsuario(usuario)">
                        Eliminar
                    </button>

                </td>

            </tr>

        </tbody>

    </table>

    <div *ngIf="editando">

        <h2>Editar Usuario</h2>

        <input
            type="text"
            [(ngModel)]="usuarioEditando.nombre">

        <input
            type="email"
            [(ngModel)]="usuarioEditando.email">

        <select
            [(ngModel)]="usuarioEditando.rol">

            <option value="Usuario">
                Usuario
            </option>

            <option value="Admin">
                Admin
            </option>

        </select>

        <button
            (click)="guardarEdicion()">
            Guardar
        </button>

        <button
            (click)="cancelarEdicion()">
            Cancelar
        </button>

    </div>

</div>
