<div class="home" [ngStyle]="{'background': colorFondo}">

  <h1>💻 Sistema de Tickets de Soporte</h1>

  <p>¿En qué puedo ayudarte?</p>

  <div class="fecha">

    <span>Hoy es</span>

    <h2>
      {{ hoy | date:'fullDate' }}
    </h2>

  </div>

  <div
    class="acceso"
    *ngIf="!logueado">

    <a
      routerLink="/login"
      class="btn-ingresar">

      Ingresar al Sistema

    </a>

  </div>

</div>
